<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project - Task Manager Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Daftar Tugas Harian</h1>
            <p id="tanggal-hari-ini"></p>
        </header>

        <div class="input-group">
            <input type="text" id="input-tugas" placeholder="Tulis tugas baru di sini...">
            <select id="prioritas-tugas">
                <option value="Rendah">Rendah</option>
                <option value="Sedang" selected>Sedang</option>
                <option value="Tinggi">Tinggi</option>
            </select>
            <button id="btn-tambah">Tambah</button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" data-filter="semua">Semua</button>
            <button class="filter-btn" data-filter="belum">Belum Selesai</button>
            <button class="filter-btn" data-filter="selesai">Selesai</button>
        </div>

        <ul id="daftar-tugas"></ul>

        <footer>
            <span id="info-sisa">0 tugas tersisa</span>
            <button id="btn-hapus-selesai">Hapus yang Selesai</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
